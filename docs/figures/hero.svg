<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#14203a"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/>
    </marker>
    <marker id="mA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
    <marker id="mP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f472b6"/>
    </marker>
  </defs>

  <rect width="960" height="580" rx="16" fill="url(#bg)"/>

  <!-- title -->
  <text x="32" y="46" fill="#f8fafc" font-size="28" font-weight="800">CiteSearch-RL</text>
  <text x="32" y="70" fill="#94a3b8" font-size="14">a 3B open model that searches, reads, and cites its sources · trained with reinforcement learning</text>

  <!-- ===== QUESTION ===== -->
  <g>
    <path d="M40,210 h130 a12,12 0 0 1 12,12 v70 a12,12 0 0 1 -12,12 h-90 l-22,20 v-20 h-18 a12,12 0 0 1 -12,-12 v-70 a12,12 0 0 1 12,-12 z" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="105" y="272" fill="#f8fafc" font-size="48" font-weight="800" text-anchor="middle">?</text>
    <text x="105" y="356" fill="#cbd5e1" font-size="13" text-anchor="middle" font-weight="600">multi-hop question</text>
  </g>
  <line x1="186" y1="255" x2="206" y2="255" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#m)"/>

  <!-- ===== AGENT ===== -->
  <g>
    <circle cx="270" cy="255" r="78" fill="url(#glowTeal)"/>
    <circle cx="270" cy="255" r="58" fill="#0f2a2a" stroke="#2dd4bf" stroke-width="2.5"/>
    <!-- robot -->
    <line x1="270" y1="222" x2="270" y2="208" stroke="#2dd4bf" stroke-width="3"/>
    <circle cx="270" cy="205" r="5" fill="#2dd4bf"/>
    <rect x="240" y="222" width="60" height="48" rx="12" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="257" cy="243" r="6" fill="#5eead4"/>
    <circle cx="283" cy="243" r="6" fill="#5eead4"/>
    <rect x="256" y="256" width="28" height="5" rx="2.5" fill="#5eead4"/>
    <rect x="232" y="240" width="7" height="14" rx="2" fill="#2dd4bf"/>
    <rect x="301" y="240" width="7" height="14" rx="2" fill="#2dd4bf"/>
    <text x="270" y="166" fill="#f8fafc" font-size="14" text-anchor="middle" font-weight="700">Qwen2.5-3B agent</text>
    <text x="270" y="184" fill="#94a3b8" font-size="12" text-anchor="middle">thinks, then picks a tool</text>
  </g>
  <line x1="332" y1="255" x2="404" y2="255" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#m)"/>

  <!-- ===== TOOL LOOP ===== -->
  <g>
    <circle cx="500" cy="255" r="85" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 6"/>
    <!-- arrows along the loop -->
    <path d="M540,182 A85,85 0 0 1 580,230" fill="none" stroke="#fbbf24" stroke-width="3" marker-end="url(#mA)"/>
    <path d="M580,282 A85,85 0 0 1 540,328" fill="none" stroke="#fbbf24" stroke-width="3" marker-end="url(#mA)"/>
    <path d="M460,328 A85,85 0 0 1 418,270" fill="none" stroke="#fbbf24" stroke-width="3" marker-end="url(#mA)"/>
    <path d="M418,240 A85,85 0 0 1 460,182" fill="none" stroke="#fbbf24" stroke-width="3" marker-end="url(#mA)"/>
    <text x="500" y="251" fill="#94a3b8" font-size="12" text-anchor="middle">up to 8</text>
    <text x="500" y="267" fill="#94a3b8" font-size="12" text-anchor="middle">tool calls</text>

    <!-- SEARCH node (top) -->
    <circle cx="500" cy="170" r="30" fill="#2a1f0a" stroke="#fbbf24" stroke-width="2.5"/>
    <circle cx="495" cy="165" r="10" fill="none" stroke="#fde68a" stroke-width="3.5"/>
    <line x1="503" y1="173" x2="514" y2="184" stroke="#fde68a" stroke-width="4.5" stroke-linecap="round"/>
    <text x="500" y="128" fill="#fde68a" font-size="13" text-anchor="middle" font-weight="700">search</text>

    <!-- READ node (right) -->
    <circle cx="585" cy="255" r="30" fill="#2a1f0a" stroke="#fbbf24" stroke-width="2.5"/>
    <path d="M573,241 h17 l7,7 v22 h-24 z" fill="#fde68a"/>
    <path d="M590,241 v7 h7" fill="none" stroke="#2a1f0a" stroke-width="1.5"/>
    <line x1="578" y1="255" x2="592" y2="255" stroke="#2a1f0a" stroke-width="2"/>
    <line x1="578" y1="261" x2="592" y2="261" stroke="#2a1f0a" stroke-width="2"/>
    <line x1="578" y1="267" x2="588" y2="267" stroke="#2a1f0a" stroke-width="2"/>
    <text x="585" y="303" fill="#fde68a" font-size="13" text-anchor="middle" font-weight="700">read</text>

    <!-- THINK node (bottom) -->
    <circle cx="500" cy="340" r="26" fill="#0f2a2a" stroke="#2dd4bf" stroke-width="2.5"/>
    <circle cx="500" cy="336" r="9" fill="none" stroke="#5eead4" stroke-width="3"/>
    <rect x="495" y="345" width="10" height="6" rx="1.5" fill="#5eead4"/>
    <line x1="500" y1="322" x2="500" y2="318" stroke="#5eead4" stroke-width="2"/>
    <line x1="488" y1="327" x2="485" y2="324" stroke="#5eead4" stroke-width="2"/>
    <line x1="512" y1="327" x2="515" y2="324" stroke="#5eead4" stroke-width="2"/>
    <text x="500" y="384" fill="#99f6e4" font-size="13" text-anchor="middle" font-weight="700">think again</text>
  </g>

  <!-- ===== CORPUS ===== -->
  <g>
    <line x1="585" y1="286" x2="585" y2="418" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 4"/>
    <ellipse cx="612" cy="422" rx="52" ry="12" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <rect x="560" y="422" width="104" height="44" fill="#1e293b"/>
    <line x1="560" y1="422" x2="560" y2="466" stroke="#64748b" stroke-width="1.5"/>
    <line x1="664" y1="422" x2="664" y2="466" stroke="#64748b" stroke-width="1.5"/>
    <ellipse cx="612" cy="466" rx="52" ry="12" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <path d="M560,444 a52,12 0 0 0 104,0" fill="none" stroke="#64748b" stroke-width="1"/>
    <!-- little docs on the cylinder -->
    <rect x="592" y="436" width="12" height="16" rx="1.5" fill="#94a3b8"/>
    <rect x="608" y="436" width="12" height="16" rx="1.5" fill="#94a3b8"/>
    <rect x="624" y="436" width="12" height="16" rx="1.5" fill="#94a3b8"/>
    <text x="612" y="500" fill="#cbd5e1" font-size="13" text-anchor="middle" font-weight="600">offline corpus</text>
    <text x="612" y="516" fill="#94a3b8" font-size="12" text-anchor="middle">~10 passages per question, BM25</text>
  </g>

  <!-- loop -> answer -->
  <line x1="620" y1="255" x2="686" y2="255" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#m)"/>

  <!-- ===== ANSWER ===== -->
  <g>
    <rect x="692" y="196" width="232" height="118" rx="14" fill="#0f2a2a" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="902" cy="216" r="13" fill="#10b981"/>
    <path d="M895,216 l5,5 l9,-10" fill="none" stroke="#052e16" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="710" y="238" fill="#f8fafc" font-size="26" font-weight="800">Canada</text>
    <rect x="710" y="252" width="130" height="22" rx="11" fill="#134e4a" stroke="#2dd4bf"/>
    <text x="775" y="267" fill="#ccfbf1" font-size="11" text-anchor="middle" font-family="Menlo, Consolas, monospace">[Blue Harvest (film)]</text>
    <rect x="710" y="280" width="140" height="22" rx="11" fill="#134e4a" stroke="#2dd4bf"/>
    <text x="780" y="295" fill="#ccfbf1" font-size="11" text-anchor="middle" font-family="Menlo, Consolas, monospace">[Jane Doe (director)]</text>
    <text x="808" y="338" fill="#f8fafc" font-size="14" text-anchor="middle" font-weight="700">answer + citations</text>
    <text x="808" y="356" fill="#94a3b8" font-size="12" text-anchor="middle">every citation must be a passage it read</text>
  </g>

  <!-- ===== REWARD ===== -->
  <g>
    <line x1="808" y1="364" x2="808" y2="392" stroke="#f472b6" stroke-width="2.5" marker-end="url(#mP)"/>
    <!-- medal -->
    <path d="M796,470 l-12,22 l14,-4 l6,12 l8,-30 z" fill="#f472b6"/>
    <path d="M820,470 l12,22 l-14,-4 l-6,12 l-8,-30 z" fill="#f472b6"/>
    <circle cx="808" cy="440" r="30" fill="#3f1d2e" stroke="#f472b6" stroke-width="2.5"/>
    <polygon points="808,420 813.5,433 828,434 817,443 820.5,457 808,449.5 795.5,457 799,443 788,434 802.5,433" fill="#fbcfe8"/>
    <text x="860" y="436" fill="#fbcfe8" font-size="13" font-weight="700">reward</text>
    <text x="860" y="452" fill="#f9a8d4" font-size="12">correct ×</text>
    <text x="860" y="467" fill="#f9a8d4" font-size="12">cited what</text>
    <text x="860" y="482" fill="#f9a8d4" font-size="12">it read</text>
  </g>

  <!-- reward feedback to the agent -->
  <path d="M780,464 C 740,575 330,575 272,320" fill="none" stroke="#f472b6" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#mP)"/>
  <rect x="300" y="446" width="230" height="40" rx="8" fill="#3f1d2e" stroke="#f472b6" stroke-width="1.5"/>
  <text x="415" y="463" fill="#fbcfe8" font-size="13" text-anchor="middle" font-weight="700">GRPO update (rLLM + veRL)</text>
  <text x="415" y="479" fill="#f9a8d4" font-size="11" text-anchor="middle">512 episodes per step · one A100</text>
</svg>
