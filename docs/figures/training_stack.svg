<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="aV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/>
    </marker>
    <marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/>
    </marker>
    <marker id="aY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="960" height="620" rx="14" fill="#0b1220"/>
  <text x="32" y="40" fill="#f8fafc" font-size="20" font-weight="700">Training stack: rLLM runs the agent, veRL runs GRPO, one A100 80 GB, colocated</text>
  <text x="32" y="62" fill="#94a3b8" font-size="13">Per step: 32 questions × 16 rollouts = 512 episodes, ~190 s. 99 steps, ~5.2 h.</text>
  <text x="32" y="79" fill="#94a3b8" font-size="13">Checkpoints every 25 steps mirrored to the Hub; best kept by the dev metric.</text>

  <!-- rLLM layer -->
  <rect x="32" y="100" width="896" height="220" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="48" y="124" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1">rLLM  ·  AGENT LAYER  (rllm_workflow.py, env.py)</text>

  <!-- AgentExecutionEngine -->
  <rect x="48" y="138" width="250" height="164" rx="10" fill="#132238" stroke="#1e3a5f"/>
  <text x="64" y="162" fill="#f8fafc" font-size="14" font-weight="600">AgentExecutionEngine</text>
  <text x="64" y="182" fill="#cbd5e1" font-size="12">runs 512 episodes concurrently;</text>
  <text x="64" y="200" fill="#cbd5e1" font-size="12">each is a DeepResearchWorkflow:</text>
  <text x="76" y="220" fill="#94a3b8" font-size="12">DeepResearchAgent (prompt, parse)</text>
  <text x="76" y="238" fill="#94a3b8" font-size="12">DeepResearchEnv (tools, reward)</text>
  <text x="64" y="266" fill="#cbd5e1" font-size="12">merges each episode into one row</text>
  <text x="64" y="284" fill="#cbd5e1" font-size="12">with a loss mask + terminal reward</text>

  <!-- vLLM engine -->
  <rect x="330" y="138" width="250" height="164" rx="10" fill="#132238" stroke="#1e3a5f"/>
  <text x="346" y="162" fill="#f8fafc" font-size="14" font-weight="600">vLLM rollout engine</text>
  <text x="346" y="182" fill="#cbd5e1" font-size="12">batched generation for every</text>
  <text x="346" y="200" fill="#cbd5e1" font-size="12">active episode, one call per round</text>
  <text x="346" y="220" fill="#cbd5e1" font-size="12">holds the merged SFT weights;</text>
  <text x="346" y="238" fill="#cbd5e1" font-size="12">the RL LoRA is hot-swapped in</text>
  <text x="346" y="256" fill="#cbd5e1" font-size="12">after every optimiser step</text>
  <text x="346" y="282" fill="#94a3b8" font-size="12">per-turn stop sequences, T = 0.9</text>

  <!-- Env -->
  <rect x="612" y="138" width="300" height="164" rx="10" fill="#2a1f0a" stroke="#fbbf24"/>
  <text x="628" y="162" fill="#fbbf24" font-size="14" font-weight="600">DeepResearchEnv × 512</text>
  <text x="628" y="182" fill="#cbd5e1" font-size="12">search / read / answer over a per-question</text>
  <text x="628" y="200" fill="#cbd5e1" font-size="12">BM25 corpus; records what was read</text>
  <text x="628" y="226" fill="#cbd5e1" font-size="12">terminal reward, rule-based, no judge:</text>
  <text x="628" y="244" fill="#fde68a" font-size="12" font-family="Menlo, Consolas, monospace">outcome × grounding, citation-gated</text>
  <text x="628" y="270" fill="#94a3b8" font-size="12">logs per step: reward components,</text>
  <text x="628" y="288" fill="#94a3b8" font-size="12">turns · reads · searches · answered · capped</text>

  <!-- arrows within rLLM layer -->
  <line x1="298" y1="196" x2="330" y2="196" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="330" y1="246" x2="298" y2="246" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="314" y="188" fill="#94a3b8" font-size="10" text-anchor="middle">prompts</text>
  <text x="314" y="262" fill="#94a3b8" font-size="10" text-anchor="middle">turns</text>
  <line x1="580" y1="220" x2="612" y2="220" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#aY)"/>
  <line x1="612" y1="250" x2="580" y2="250" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#aY)"/>
  <text x="596" y="212" fill="#fde68a" font-size="10" text-anchor="middle">action</text>
  <text x="596" y="266" fill="#fde68a" font-size="10" text-anchor="middle">obs</text>

  <!-- down arrow: trajectories -->
  <line x1="173" y1="320" x2="173" y2="364" stroke="#a78bfa" stroke-width="2" marker-end="url(#aV)"/>
  <text x="186" y="346" fill="#c4b5fd" font-size="12">512 merged rows + loss mask + reward</text>

  <!-- weight sync arrow back up to vLLM -->
  <line x1="560" y1="364" x2="560" y2="320" stroke="#2dd4bf" stroke-width="2" marker-end="url(#aT)"/>
  <text x="572" y="346" fill="#99f6e4" font-size="12">updated LoRA weights synced into vLLM after each step</text>

  <!-- veRL layer -->
  <rect x="32" y="366" width="896" height="200" rx="12" fill="#150f2a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="48" y="390" fill="#a78bfa" font-size="12" font-weight="700" letter-spacing="1">veRL 0.9  ·  TRAINING ENGINE  (train_dr.py → AgentTrainer)</text>

  <!-- GRPO advantage -->
  <rect x="48" y="404" width="250" height="146" rx="10" fill="#1e1638" stroke="#3b2d63"/>
  <text x="64" y="428" fill="#f8fafc" font-size="14" font-weight="600">GRPO advantage</text>
  <text x="64" y="450" fill="#cbd5e1" font-size="12">group-relative, per question:</text>
  <text x="64" y="476" fill="#e9d5ff" font-size="15" font-family="'STIX Two Math','Cambria Math','Latin Modern Math','Times New Roman',serif"><tspan font-style="italic">Â</tspan><tspan baseline-shift="sub" font-size="9">i</tspan> =</text><text x="160" y="468" fill="#e9d5ff" font-size="13" font-family="'STIX Two Math','Cambria Math','Latin Modern Math','Times New Roman',serif" text-anchor="middle"><tspan font-style="italic">r</tspan><tspan baseline-shift="sub" font-size="9">i</tspan> − <tspan font-style="italic">μ</tspan><tspan baseline-shift="sub" font-size="9">G</tspan></text><line x1="120" y1="473" x2="200" y2="473" stroke="#e9d5ff" stroke-width="1"/><text x="160" y="487" fill="#e9d5ff" font-size="13" font-family="'STIX Two Math','Cambria Math','Latin Modern Math','Times New Roman',serif" text-anchor="middle"><tspan font-style="italic">σ</tspan><tspan baseline-shift="sub" font-size="9">G</tspan> + <tspan font-style="italic">ε</tspan></text>
  <text x="64" y="506" fill="#cbd5e1" font-size="12"><tspan font-style="italic">G</tspan> = 16 rollouts of the same question</text>
  <text x="64" y="522" fill="#94a3b8" font-size="12">all-equal groups carry no gradient;</text>
  <text x="64" y="538" fill="#94a3b8" font-size="12">dead-group % is logged every step</text>

  <!-- Actor update -->
  <rect x="330" y="404" width="250" height="146" rx="10" fill="#1e1638" stroke="#3b2d63"/>
  <text x="346" y="428" fill="#f8fafc" font-size="14" font-weight="600">Actor update (FSDP)</text>
  <text x="346" y="450" fill="#cbd5e1" font-size="12">masked policy gradient over policy</text>
  <text x="346" y="468" fill="#cbd5e1" font-size="12">tokens only, plus KL to the reference</text>
  <text x="346" y="490" fill="#e9d5ff" font-size="14" font-family="'STIX Two Math','Cambria Math','Latin Modern Math','Times New Roman',serif"><tspan font-style="italic">L</tspan> = − <tspan font-style="italic">Â</tspan><tspan baseline-shift="sub" font-size="9">i</tspan> · log <tspan font-style="italic">π</tspan><tspan baseline-shift="sub" font-size="9">θ</tspan>(<tspan font-style="italic">y</tspan><tspan baseline-shift="sub" font-size="9">t</tspan> | <tspan font-style="italic">y</tspan><tspan baseline-shift="sub" font-size="9">&lt;t</tspan>)</text><text x="346" y="508" fill="#e9d5ff" font-size="14" font-family="'STIX Two Math','Cambria Math','Latin Modern Math','Times New Roman',serif">&#160;&#160;&#160;&#160;&#160;+ <tspan font-style="italic">β</tspan><tspan baseline-shift="sub" font-size="9">KL</tspan> · KL(<tspan font-style="italic">π</tspan><tspan baseline-shift="sub" font-size="9">θ</tspan> ‖ <tspan font-style="italic">π</tspan><tspan baseline-shift="sub" font-size="9">SFT</tspan>),&#160; <tspan font-style="italic">β</tspan><tspan baseline-shift="sub" font-size="9">KL</tspan> = 0.01</text>
  <text x="346" y="526" fill="#cbd5e1" font-size="12">LoRA r=16, lr 5e-5, Liger kernels</text>
  <text x="346" y="542" fill="#94a3b8" font-size="12">policy tokens only; observations masked</text>

  <!-- Reference -->
  <rect x="612" y="404" width="300" height="146" rx="10" fill="#1e1638" stroke="#3b2d63"/>
  <text x="628" y="428" fill="#f8fafc" font-size="14" font-weight="600">Reference policy = the SFT policy</text>
  <text x="628" y="450" fill="#cbd5e1" font-size="12">the SFT adapter is MERGED into the base</text>
  <text x="628" y="468" fill="#cbd5e1" font-size="12">(distill/merge_sft.py), so "adapter off"</text>
  <text x="628" y="486" fill="#cbd5e1" font-size="12">= the SFT weights, not the untuned model.</text>
  <text x="628" y="512" fill="#94a3b8" font-size="12">Otherwise the KL term pulls the policy</text>
  <text x="628" y="530" fill="#94a3b8" font-size="12">away from everything SFT installed.</text>

  <line x1="298" y1="478" x2="330" y2="478" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#aV)"/>
  <line x1="612" y1="478" x2="580" y2="478" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#aV)"/>
  <text x="596" y="470" fill="#c4b5fd" font-size="10" text-anchor="middle">log π_ref</text>

  <!-- footer: observability -->
  <text x="32" y="590" fill="#94a3b8" font-size="12">Observability: W&amp;B (reward components, tool counts, dead-group %, step timing) · Hugging Face Hub (full checkpoint</text>
  <text x="32" y="606" fill="#94a3b8" font-size="12">with optimiser state for resume, best adapter) · periodic dev eval every 25 steps (n=128) for model selection.</text>
  <g transform="translate(900,120)" fill="none" stroke="#38bdf8" stroke-width="2.5"><circle cx="0" cy="0" r="7"/><g stroke-linecap="round"><line x1="0" y1="-14" x2="0" y2="-10"/><line x1="0" y1="10" x2="0" y2="14"/><line x1="-14" y1="0" x2="-10" y2="0"/><line x1="10" y1="0" x2="14" y2="0"/><line x1="-10" y1="-10" x2="-7" y2="-7"/><line x1="7" y1="7" x2="10" y2="10"/><line x1="-10" y1="10" x2="-7" y2="7"/><line x1="7" y1="-7" x2="10" y2="-10"/></g></g>
  <g transform="translate(900,386)" fill="none" stroke="#a78bfa" stroke-width="2.5"><circle cx="0" cy="0" r="7"/><g stroke-linecap="round"><line x1="0" y1="-14" x2="0" y2="-10"/><line x1="0" y1="10" x2="0" y2="14"/><line x1="-14" y1="0" x2="-10" y2="0"/><line x1="10" y1="0" x2="14" y2="0"/><line x1="-10" y1="-10" x2="-7" y2="-7"/><line x1="7" y1="7" x2="10" y2="10"/><line x1="-10" y1="10" x2="-7" y2="7"/><line x1="7" y1="-7" x2="10" y2="-10"/></g></g>
  <g transform="translate(890,160)"><ellipse cx="0" cy="-12" rx="16" ry="5" fill="#422e0b" stroke="#fbbf24" stroke-width="1.5"/><rect x="-16" y="-12" width="32" height="20" fill="#422e0b"/><line x1="-16" y1="-12" x2="-16" y2="8" stroke="#fbbf24" stroke-width="1.5"/><line x1="16" y1="-12" x2="16" y2="8" stroke="#fbbf24" stroke-width="1.5"/><ellipse cx="0" cy="8" rx="16" ry="5" fill="#422e0b" stroke="#fbbf24" stroke-width="1.5"/><path d="M-16,-2 a16,5 0 0 0 32,0" fill="none" stroke="#fbbf24" stroke-width="1"/></g>
  <g transform="translate(560,160)"><circle cx="-3" cy="-3" r="8" fill="none" stroke="#fde68a" stroke-width="3"/><line x1="3" y1="3" x2="11" y2="11" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/></g>
</svg>
